    let activeQuestions = [];

    function shuffle(array) {
        let arr = JSON.parse(JSON.stringify(array));
        for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadQuiz() {
        activeQuestions = shuffle(rawQuestions).map((q, index) => ({
            id: index + 1,
            section: q.section,
            question: q.question,
            options: shuffle(q.options),
            explanation: q.explanation
        }));

        const container = document.getElementById('quiz-container');
        container.innerHTML = '';

        activeQuestions.forEach((q, qIndex) => {
            let optionsHtml = '';
            const labels = ['A', 'B', 'C', 'D'];

            q.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <label class="option-label">
                        <input type="radio" name="q-${qIndex}" value="${optIndex}">
                        <strong>${labels[optIndex]}.</strong>
                        <span>${opt.text}</span>
                    </label>
                `;
            });

            container.innerHTML += `
                <div class="question-card">
                    <div class="section-tag">${q.section}</div>
                    <div class="q-title">Câu ${q.id}: ${q.question}</div>
                    <div>${optionsHtml}</div>
                    <div id="exp-${qIndex}" class="explanation"></div>
                </div>
            `;
        });

        document.getElementById('result-box').style.display = 'none';
    }

    function checkAnswers() {
        let score = 0;

        activeQuestions.forEach((q, qIndex) => {
            const selected = document.querySelector(`input[name="q-${qIndex}"]:checked`);
            const expBox = document.getElementById(`exp-${qIndex}`);

            if (selected) {
                const selectedIdx = parseInt(selected.value);
                if (q.options[selectedIdx].isCorrect) {
                    score++;
                    expBox.className = "explanation correct";
                    expBox.innerHTML = `<strong>Chính xác!</strong> ${q.explanation}`;
                } else {
                    expBox.className = "explanation incorrect";
                    expBox.innerHTML = `<strong>Chưa đúng.</strong> ${q.explanation}`;
                }
            } else {
                expBox.className = "explanation unanswered";
                expBox.innerHTML = `<strong>Bạn chưa chọn!</strong> ${q.explanation}`;
            }
        });

        const resultBox = document.getElementById('result-box');
        resultBox.style.display = 'block';
        resultBox.innerHTML = `Kết quả của bạn: ${score} / ${activeQuestions.length} câu đúng!`;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    window.onload = loadQuiz;
</script>
